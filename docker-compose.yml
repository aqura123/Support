version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: supportpulse-db
    environment:
      POSTGRES_DB: SupportPulse_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d SupportPulse_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: SupportPulse.App/Dockerfile
    container_name: supportpulse-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__Development=Host=postgres;Port=5432;Database=SupportPulse_DB;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5000:8080"
    volumes:
      - app-uploads:/app/UploadedFiles
    restart: unless-stopped

volumes:
  postgresdata:
  app-uploads:
